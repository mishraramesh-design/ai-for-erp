  let c = 0, base = 0; const by = {};
  for (const u of S.usage){ const k = ucost(u); c += k; base += ucost(u,'strong'); by[u.agent] = (by[u.agent]||0) + k; }

  const all = tc.rule + tc.recipe + tc.pattern + tc.model; const share = all ? (all - tc.model) / all : 0;

/* ============ orchestration: a dependency-driven scheduler ============ */
function terminal(n){ return n.st === 'done' || n.st === 'blocked'; }
function pump(){
  if (!S.running) return;
  const run = S.nodes.filter(n => n.st === 'running').length; let cap = S.par - run;
  for (const n of S.nodes){ if (cap <= 0) break;
    if (n.st === 'waiting' && n.deps.every(d => terminal(S.byId[d]))){ n.st = 'running'; cap--; exec(n); } }
  if (S.nodes.every(terminal)){ S.running = false; S.runDone = true; finishRun(); }
  render();
}
function finishRun(){
  const t = totals(); S.runNo++;

  const p = S.play, ex = EXIST()[p.doctype] || [], errs = [], checks = []; let spec = {};
  const near = f => ex.find(x => x.includes(f) || f.includes(x)) || ex.find(x => x.slice(0,4) === f.slice(0,4));
  if (p.recipe === 'custom_field'){
    const fn = snake(p.label); spec = {op:'add_custom_field',doctype:p.doctype,fieldname:fn,label:p.label,fieldtype:p.type};
    if (p.type === 'Select') spec.options = p.options.split(',').map(s => s.trim()).filter(Boolean);
    if (!p.label.trim()) errs.push('Label is empty.'); if (ex.includes(fn)) errs.push(`Fieldname "${fn}" already exists on ${p.doctype}.`);
    if (p.type === 'Select' && !(spec.options||[]).length) errs.push('A Select field needs at least one option.');
    checks.push(`${p.doctype}.${fn} exists`,`type is ${p.type}`);
  } else if (p.recipe === 'mandatory_if'){
    spec = {op:'set_property',doctype:p.doctype,fieldname:p.field,property:'mandatory_depends_on',value:`eval:doc.${p.when}=="${p.equals}"`};
    [p.field,p.when].forEach(f => { if (!ex.includes(f)) errs.push(`Field "${f}" does not exist on ${p.doctype}.` + (near(f) ? ` Did you mean "${near(f)}"?` : '')); });
    checks.push(`Property mandatory_depends_on on ${p.doctype}.${p.field} reads back the same value`);
  } else {
    const st = p.states.split(',').map(s => s.trim()).filter(Boolean);
    spec = {op:'approval_workflow',doctype:p.doctype,states:st,transitions:st.slice(1).map((s,i) => ({from:st[i],to:s,role:p.role}))};
    if (st.length < 2) errs.push('A workflow needs at least two states.'); if (!ROLES().includes(p.role)) errs.push(`Role "${p.role}" does not exist. Add a create_role step first.`);
    checks.push('Workflow is active','No dead-end or unreachable state',`${Math.max(0,st.length - 1)} transitions use existing roles`);
  }
  return {spec,errs,checks};

  <div class="row"><div class="card col" style="flex:2 1 460px"><div class="row ctr"><h3 style="margin:0">${A.n} · live v${live.v}</h3><span class="chip ${p.draft === live.text ? '' : 'hold'}">${p.draft === live.text ? 'no unsaved edits' : 'draft differs from live'}</span></div>
    <div class="small muted" style="margin:8px 0 4px">1 · Locked contract (not editable)</div><pre>Output: one JSON object matching the typed schema\nAllowed operations: ${A.emits.join(', ')}\nLimits: ${A.no}\nEvery output is validated by the Engine before any change.\nOutside prompts: output schema, risk levels, policy gate.</pre>
    <div class="small muted" style="margin:10px 0 4px">2 · Your instructions (editable)</div><textarea class="input" rows="10" data-ptxt="${a}" aria-label="${A.n} instructions">${esc(p.draft)}</textarea>
    <div class="small muted" style="margin:10px 0 4px">3 · Project knowledge attached automatically</div><div class="row" style="gap:6px"><span class="chip">module pack for the work item</span><span class="chip">naming conventions</span><span class="chip">12 approved examples</span><span class="chip">site metadata (read only)</span></div>
    <div class="row" style="margin-top:12px"><button class="btn pri sm" data-act="ptest">Test on golden set</button><button class="btn sm" data-act="ppromote" ${can ? '' : 'disabled'}>Promote as v${p.versions.length + 1}</button><button class="btn sm" data-act="preset" ${p.draft === live.text ? 'disabled' : ''}>Discard edits</button></div>${cmp}</div>
   <div class="card col"><h3>Versions</h3><ul class="ops">${p.versions.map((v,i) => `<li><span class="chip ${i === p.live ? 'ok' : ''}">v${v.v}${i === p.live ? ' live' : ''}</span><span class="t">${esc(v.note)} · pass ${v.score.pass}%${i !== p.live ? ` <button class="btn sm" data-act="prollback" data-arg="${i}">Roll back</button>` : ''}</span></li>`).join('')}</ul>
    <h3 style="margin-top:12px">Audit log</h3><div class="small mono">${S.audit.length ? S.audit.map(x => `<div>${esc(x)}</div>`).join('') : '<span class="muted">No prompt changes yet.</span>'}</div></div></div>`;
}
function viewOrch(){
  const a = S.flowAgent, A = AG[a], r = S.roles[a], lf = S.mode !== 'kernel';
  const modes = Object.entries(MODES).map(([k,m]) => `<label class="card col opt ${S.mode === k ? 'on' : ''}" style="min-width:250px"><input type="radio" name="mode" value="${k}" ${S.mode === k ? 'checked' : ''}> <b>${m.n}</b> ${m.rec ? '<span class="chip ok">recommended</span>' : ''}<div class="small" style="margin-top:4px">${m.pro}</div><div class="small muted" style="margin-top:4px">Trade-off: ${m.con}</div></label>`).join('');
  const opt = sel => Object.entries(S.prices).map(([k,m]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
  const adapters = AGENT_ORDER.filter(x => AG[x].tok).map(x => `<tr><td>${AG[x].n}</td><td><select class="input" style="width:auto" data-backend="${x}" ${S.mode === 'kernel' ? 'disabled' : ''}><option value="builtin" ${S.backend[x] !== 'langflow' ? 'selected' : ''}>built-in call</option><option value="langflow" ${S.backend[x] === 'langflow' ? 'selected' : ''}>Langflow flow ${x}_v${promptLive(x)}</option></select></td><td class="small muted">${S.backend[x] === 'langflow' && lf ? 'published' : 'direct'}</td></tr>`).join('');
  const box = (h,b,c) => `<div class="bx" style="${c ? 'border-color:' + c : ''}"><b>${h}</b><br><span class="muted">${b}</span></div>`;
  const gate = [['Output matches the typed schema (re-checked by the kernel)',true],['Golden-set pass is not below the live version',!!(S.prompts[a].test && S.prompts[a].test.nw.pass >= S.prompts[a].test.cur.pass) || S.flowPub[a]],['No code, HTTP or file components in the flow',true],['No ERPNext credentials inside Langflow (it only calls Studio tools)',true],['Admin approval recorded',!!S.flowPub[a]]];
  return `<div class="card"><h3>Orchestration mode</h3><div class="row">${modes}</div></div>
  <div class="row"><div class="card col"><h3>The kernel always does</h3><ul class="ops">${['Task graph and dependency order','Parallelism and per-agent concurrency','Risk gates and approvals that wait for people','Retries, repair, escalation to a stronger model','Budgets and stop','Snapshots, undo, audit log','Calling the Engine to validate, apply, verify'].map(x => `<li><span class="chip rule">kernel</span><span class="t">${x}</span></li>`).join('')}</ul></div>
   <div class="card col"><h3>Langflow flows do (agent steps only)</h3><ul class="ops">${['Prompt assembly from the Studio prompt registry','Retrieve the module pack and examples','Call the chosen model','Parse the answer into the strict schema','Optional read-only tools served by the Studio (site metadata)','Visual editing and a playground for each agent'].map(x => `<li><span class="chip model">flow</span><span class="t">${x}</span></li>`).join('')}</ul><p class="small muted" style="margin:8px 0 0">A flow can change how an agent reasons. It cannot change what is allowed to happen: the kernel validates every output.</p></div></div>
  <div class="card"><div class="row ctr"><h3 style="margin:0">Flow lab · ${A.n}</h3><span class="sp"></span>${AGENT_ORDER.filter(x => AG[x].tok).map(x => `<button class="btn sm ${x === a ? 'pri' : ''}" data-act="fagent" data-arg="${x}">${AG[x].n.replace(' agent','')}</button>`).join('')}</div>
   <div class="cv" style="margin-top:10px">${box('Typed input','work item, requirement text, depends-on')}<span class="ar">→</span>${box('Retriever','module pack and approved examples')}<span class="ar">→</span>${box('Prompt','v' + promptLive(a) + ' from the registry (read only here)','var(--accent)')}<span class="ar">→</span>
    <div class="bx" style="border-color:#D99A1E"><b>Model</b><br><select class="input" data-role="${a}" data-k="primary" aria-label="flow model">${opt(r.primary)}</select></div><span class="ar">→</span>${box('Strict schema parser','invalid output is rejected and retried')}<span class="ar">→</span>${box('Typed output','handed to the kernel','var(--rule)')}</div>
   <div class="row" style="margin-top:12px"><div class="col"><div class="small muted" style="margin-bottom:4px">Components allowed in Studio flows</div><div class="row" style="gap:4px">${['Prompt (registry)','Model','Retriever','Schema parser','Read-only site tool'].map(x => `<span class="chip ok">${x}</span>`).join('')}</div>
     <div class="small muted" style="margin:8px 0 4px">Blocked</div><div class="row" style="gap:4px">${['Python code','Custom HTTP request','File write','Shell'].map(x => `<span class="chip bad">${x}</span>`).join('')}</div></div>
    <div class="col"><div class="small muted" style="margin-bottom:4px">Publish gate</div><ul class="ops">${gate.map(g => `<li><span>${g[1] ? '✓' : '○'}</span><span class="t">${g[0]}</span></li>`).join('')}</ul>
     <div class="row" style="margin-top:8px"><button class="btn sm" data-act="noop">Open in Langflow</button><button class="btn pri sm" data-act="fpub" ${S.flowPub[a] ? 'disabled' : ''}>${S.flowPub[a] ? 'Published' : 'Request publish approval'}</button></div></div></div></div>
  <div class="card"><h3>Which agents run through Langflow</h3><div class="scroll"><table><thead><tr><th>Agent</th><th>Backend</th><th>State</th></tr></thead><tbody>${adapters}</tbody></table></div><p class="small muted" style="margin:8px 0 0">The pilot starts with Customize and UI/UX in Langflow and the rest built in. Both use the same input and output contract, so any agent can move either way.</p></div>
  <div class="card"><h3>Running Langflow safely</h3><ul class="ops">${['Separate container on an internal network. Never exposed to the internet.','Login required. Version pinned and upgraded deliberately. Langflow had a critical unauthenticated code-execution flaw in 2025 (CVE-2025-3248), so it is treated as an untrusted runtime.','Holds no ERPNext keys. It can only call Studio tools that return read-only metadata.','Every flow output is re-validated by the kernel and the Engine.'].map(x => `<li><span>•</span><span class="t">${x}</span></li>`).join('')}</ul></div>`;
}

/* ============ chrome ============ */
const TABS = [['over','Overview','Project'],['reqs','Requirements','Project'],['builder','App Builder','Build'],['work','Workspace','Build'],['run','Runs · task graph','Build'],['agents','Agents & models','Studio'],['prompts','Prompt studio','Studio'],['orch','Orchestration & flows','Studio'],['dec','Decision layer','Studio'],['det','Deterministic layer','Studio'],['approvals','Approvals','Govern'],['changes','Changes & undo','Govern'],['export','Export & promote','Govern'],['quality','Quality','Govern']];
const VIEWS = {over:viewOver,reqs:viewReqs,builder:viewBuilder,work:viewWork,run:viewRun,agents:viewAgents,prompts:viewPrompts,orch:viewOrch,dec:viewDecision,det:viewDet,approvals:viewApprovals,changes:viewChanges,export:viewExport,quality:viewQuality};
function tourState(){
  const held = S.nodes.filter(n => n.st === 'held').length;
  if (!S.loaded) return {n:1,h:'Load your requirements',p:'The Studio reads the matrix with no model. Your pilot picks 47 rows across three modules: Supplier Relationship, Supply Chain demand and a full Grievance case-management app.',b:'Upload the fitment matrix',a:'load'};
  if (!S.bp) return {n:2,h:'Design the case-management app first',p:'The App Builder checks what ERPNext already provides, then recommends extending the standard Issue instead of writing a new DocType.',b:'Generate blueprint',a:'bp'};
  if (!S.profile) return {n:3,h:'Pick models per agent',p:'Ten agents, each with its own model. Balanced puts a strong model on the Architect only and cheap ones elsewhere.',b:'Use the Balanced profile',a:'profile',arg:'balanced'};
  if (!S.visitedDecision) return {n:4,h:'Add the decision gateway',p:'A fast decision model picks the lane and recipe with a confidence. Confident answers skip the LLM, doubtful ones go to the Architect or to you.',b:'Open the decision layer',a:'tab',arg:'dec'};
  if (!S.visitedPrompts) return {n:5,h:'Edit an agent prompt safely',p:'Change the instructions, test them on a golden set, and promote only if they are no worse. Locked rules cannot be edited.',b:'Open the prompt studio',a:'tab',arg:'prompts'};
  if (!S.visitedOrch) return {n:6,h:'Choose how orchestration and Langflow fit',p:'Recommended: our kernel stays in charge, and agent steps run as Langflow flows you can edit visually.',b:'Open orchestration',a:'tab',arg:'orch'};
  if (!S.runNo && !S.running) return {n:7,h:'Start the pilot run',p:'The Architect splits the work into 22 items. Watch the task graph: lanes run in parallel and each item is tagged rule, recipe, saved pattern, decision model or LLM.',b:'Start run',a:'run'};
  if (S.running && !held) return {n:7,h:'The run is working',p:'Open Runs and click any work item to see its typed hand-off. The log shows the decision gateway and Langflow steps.',b:'Working…',d:1};
  if (held) return {n:8,h:'High-risk items are waiting for you',p:held + ' work item(s) grant permissions or change workflows. Review the impact and approve.',b:'Review and approve',a:'tab',arg:'approvals'};
  if (!S.chat.some(m => m.you)) return {n:9,h:'Now change something by chatting',p:'Ask for a form layout change. The Engine checks it against the live site and shows before and after.',b:'Open the workspace',a:'tab',arg:'work'};
  if (!S.visitedDet) return {n:10,h:'See what made it cheap and reliable',p:'Rules, recipes and validators did most of the work. Try a recipe yourself: no model involved.',b:'Open the deterministic layer',a:'tab',arg:'det'};
  if (!S.exported) return {n:10,h:'The run is still finishing',p:'The export happens when all work items are done.',b:'Open runs',a:'tab',arg:'run'};
  if (!S.audited) return {n:11,h:'Audit the matrix\'s "standard" claims',p:'The Auditor probes the live site and downgrades claims that do not hold.',b:'Open quality',a:'quality'};
  if (S.runNo < 2) return {n:12,h:'Save what was learned and run again',p:'Verified LLM-built changes become saved patterns. A second run shows the LLM share fall.',b:'Save patterns and run again',a:'again'};
  return {n:13,h:'Done: compare the two runs',p:'Overview shows run history. Try changes and undo, the export, or start over.',b:'Start over',a:'reset'};
}
function render(){
  const t = totals(), ts = tourState();
  $('#meter').innerHTML = `Spend <b>${money(t.c)}</b> · ${t.calls} model calls · <b>${Math.round(t.share * 100)}%</b> without an LLM`;
  $('#tour').innerHTML = `<div class="txt"><div class="step">Step ${ts.n} of 13</div><h2>${esc(ts.h)}</h2><p>${esc(ts.p)}</p></div><button class="btn pri" id="tourbtn" ${ts.d ? 'disabled' : ''}>${esc(ts.b)}</button>`;
  $('#tourbtn').onclick = () => act(ts.a,ts.arg);
  const pend = S.nodes.filter(n => n.st === 'held').length + S.questions.filter(q => S.status[q.id] === 'needs_input').length;
  let last = '';
  $('#nav').innerHTML = TABS.map(([k,l,g]) => { const h = g !== last ? `<div class="grp">${g}</div>` : ''; last = g; return h + `<button class="tab" role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}${k === 'approvals' && pend ? `<span class="n">${pend}</span>` : ''}</button>`; }).join('');
  const keep = document.activeElement && document.activeElement.dataset ? (document.activeElement.dataset.ans || document.activeElement.dataset.play) : null;
  $('#main').innerHTML = VIEWS[S.tab]();
  if (S.tab === 'run'){ const l = $('#log'); if (l) l.scrollTop = l.scrollHeight; }
  if (keep){ const el = document.querySelector(`[data-ans="${keep}"],[data-play="${keep}"]`); if (el && el.setSelectionRange){ el.focus(); try { el.setSelectionRange(el.value.length,el.value.length); } catch (e) {} } }
}
function act(a,arg){
  if (a === 'load'){ S.loaded = true; S.tab = 'builder'; }
  else if (a === 'bp'){ S.bp = true; S.tab = 'builder'; }
  else if (a === 'profile'){ setProfile(arg); }
  else if (a === 'run') return startRun();
  else if (a === 'tab'){ S.tab = arg; if (arg === 'det') S.visitedDet = true; if (arg === 'dec') S.visitedDecision = true; if (arg === 'prompts') S.visitedPrompts = true; if (arg === 'orch') S.visitedOrch = true; }
  else if (a === 'quality'){ S.tab = 'quality'; }
  else if (a === 'approve') return approve(arg);
  else if (a === 'approveall') return approveAll();
  else if (a === 'answer'){ const id = +arg, v = (S.answers[id] || '').trim(); if (!v) return; mark([id],'backlog','Answered: ' + v + ' (queued for the next run)'); say('you',`Answered [${id}]: ${v}`); S.labels++; }
  else if (a === 'undo'){ S.confirmUndo = arg; }
  else if (a === 'undo0'){ S.confirmUndo = null; }
  else if (a === 'undo2') return undoSet(arg);
  else if (a === 'recipe'){ S.play.recipe = arg; if (arg === 'mandatory_if'){ S.play.field = 'tax_id'; S.play.when = 'supplier_type'; } }
  else if (a === 'savepat'){ S.patterns = PATTERN_IDS.map(id => S.byId[id].title); }
  else if (a === 'again'){ S.patternsOn = true; if (!S.patterns.length) S.patterns = PATTERN_IDS.map(id => S.byId[id].title); startRun(); return; }
  else if (a === 'ask') return ask(arg);
  else if (a === 'wview'){ S.ws.view = arg; }
  else if (a === 'wba'){ S.ws.ba = arg; }
  else if (a === 'wtab'){ S.ws.tab = arg; }
  else if (a === 'p3keep'){ S.ws.p3 = null; S.chat.push({who:'engine',html:'Kept. Nothing changed.'}); }
  else if (a === 'p3go'){ S.ws.p3 = 'removed'; S.chat.push({who:'engine',html:'Snapshot taken. Field removed and the server script rewritten without it. Requirement 17 is now unmet and is back in the backlog. Undo is available.'}); mark([17],'backlog','Field removed by you'); }
  else if (a === 'promo1'){ S.promoBusy = true; render(); setTimeout(() => { S.promoBusy = false; S.promo = 1; render(); }, 1200 * (S.fast ? 0.15 : 1)); return; }
  else if (a === 'promo2'){ S.promo = 2; }
  else if (a === 'qtab'){ S.qtab = arg; }
  else if (a === 'audit'){ S.audited = true; }
  else if (a === 'regress'){ S.regress = true; }
  else if (a === 'bench'){ S.benchmark = true; }
  else if (a === 'wb'){ S.wroteback = true; }
  else if (a === 'calib'){ S.dec.calibrated = true; }
  else if (a === 'pagent'){ S.promptAgent = arg; }
  else if (a === 'ptest'){ testPrompt(S.promptAgent); }
  else if (a === 'ppromote') return promotePrompt(S.promptAgent);
  else if (a === 'preset'){ const p = S.prompts[S.promptAgent]; p.draft = p.versions[p.live].text; p.test = null; }
  else if (a === 'prollback'){ rollbackPrompt(S.promptAgent,+arg); }
  else if (a === 'fagent'){ S.flowAgent = arg; }
  else if (a === 'fpub'){ S.flowPub[S.flowAgent] = true; S.backend[S.flowAgent] = 'langflow'; S.audit.unshift(stamp() + ' flow ' + S.flowAgent + '_v' + promptLive(S.flowAgent) + ' published'); }
  else if (a === 'noop'){}
  else if (a === 'reset'){ init(); }
  render();
}
document.addEventListener('click', e => {
  const nd = e.target.closest('[data-node]'); if (nd){ S.sel = nd.dataset.node; render(); return; }
  const tb = e.target.closest('[data-tab]'); if (tb){ S.tab = tb.dataset.tab; if (S.tab === 'det') S.visitedDet = true; if (S.tab === 'dec') S.visitedDecision = true; if (S.tab === 'prompts') S.visitedPrompts = true; if (S.tab === 'orch') S.visitedOrch = true; render(); return; }
  const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act,b.dataset.arg);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.node){ e.preventDefault(); S.sel = e.target.dataset.node; render(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'policy'){ S.policy = t.value; render(); }
  else if (t.id === 'par'){ S.par = +t.value; render(); }
  else if (t.id === 'inject'){ S.inject = t.checked; }
  else if (t.id === 'fast'){ S.fast = t.checked; }
  else if (t.id === 'decon' || t.id === 'decon2'){ if (S.running) return render(); S.decisionOn = t.checked; resetRun(); render(); }
  else if (t.name === 'prov'){ S.dec.provider = t.value; render(); }
  else if (t.name === 'mode'){ S.mode = t.value; render(); }
  else if (t.dataset.backend){ S.backend[t.dataset.backend] = t.value; render(); }
  else if (t.dataset.pick){ S.dec.pick = +t.value; render(); }
  else if (t.dataset.thr){ const v = parseFloat(t.value); S.dec[t.dataset.thr] = v; if (S.dec.human > S.dec.auto - 0.05) S.dec.human = Math.max(0.2, S.dec.auto - 0.05); render(); }
  else if (t.name === 'fnd'){ S.foundation = t.value; S.bp = false; resetRun(); render(); }
  else if (t.dataset.role){ const r = S.roles[t.dataset.role]; r[t.dataset.k] = t.value || null; S.profile = S.profile || 'balanced'; render(); }
  else if (t.dataset.price){ const v = parseFloat(t.value); if (!isNaN(v) && v >= 0) S.prices[t.dataset.price][t.dataset.pk] = v; render(); }
  else if (t.dataset.play){ S.play[t.dataset.play] = t.value; render(); }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.ans) S.answers[t.dataset.ans] = t.value; if (t.dataset && t.dataset.ptxt){ S.prompts[t.dataset.ptxt].draft = t.value; } if (t.dataset && t.dataset.thr){ const v = parseFloat(t.value); S.dec[t.dataset.thr] = v; if (S.dec.human > S.dec.auto - 0.05) S.dec.human = Math.max(0.2, S.dec.auto - 0.05); } });
init(); render();
</script>
