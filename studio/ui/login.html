<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERPNext Studio · Sign in</title>
<style>
:root{--bg:#F2F4F7;--surface:#fff;--line:#DDE1E8;--fg:#171B24;--muted:#586174;--accent:#2B50D1;--bad:#9B1C1C}
@media (prefers-color-scheme:dark){:root{--bg:#12151C;--surface:#1B2029;--line:#2C3340;--fg:#E8ECF3;--muted:#98A2B5;--accent:#7C9BFF;--bad:#FF8A8A}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:16px}
.card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{font-size:20px;margin:0 0 4px}p{color:var(--muted);margin:0 0 20px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{margin-top:14px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--bad);min-height:1.4em;margin-top:10px;font-size:13px}
</style></head><body>
<form class="card" id="f"><h1>◆ ERPNext Studio</h1><p>AI development studio for ERPNext</p>
<label for="p" style="font-size:13px;color:var(--muted)">Admin password</label>
<input id="p" type="password" autocomplete="current-password" autofocus required>
<button>Sign in</button><div class="err" id="e" role="alert"></div></form>
<script>
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();
const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('p').value})});
if(r.ok)location.href='/';else document.getElementById('e').textContent=(await r.json()).detail||'Sign-in failed'};
</script></body></html>
